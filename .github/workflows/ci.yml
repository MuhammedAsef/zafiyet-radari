# Zafiyet Radarı — CI/CD
#   PR ve her push : build + test + gizli bilgi taraması
#   main'e push    : + imajlar (Trivy taraması geçmezse yayınlanmaz) + SBOM + VPS'e deploy
#
# Tedarik zinciri: tüm action'lar commit SHA'sıyla sabitli (etiketler sonradan değiştirilebilir).
# Dependabot (.github/dependabot.yml) bu SHA'ları güncel tutar.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Varsayılan: sadece okuma. Yazma izni gereken iş kendi bloğunda açar.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TRIVY_VERSION: v0.76.2
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  test:
    name: Build ve test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # NuGet Audit: zafiyetli doğrudan/dolaylı paket varsa restore hata verir.
      - run: dotnet restore ZafiyetRadari.slnx
      - run: dotnet build ZafiyetRadari.slnx -c Release --no-restore
      - run: dotnet test ZafiyetRadari.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Test sonuçları
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  secrets:
    name: Gizli bilgi taraması (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Tüm git geçmişi taranır; bulunan değerler loga maskeli yazılır.
      - name: gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --redact --no-banner --exit-code 1

  images:
    name: İmaj (${{ matrix.target }})
    needs: [test, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [web, worker, migrator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: İmaj adı
        id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner}/zafiyet-radari-${{ matrix.target }}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Önce yerelde oluştur ve tara; sadece temiz imaj registry'ye gider.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ steps.name.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Trivy (yamalı HIGH/CRITICAL varsa durur)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ steps.name.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ steps.name.outputs.ref }}
          format: cyclonedx
          output: sbom-${{ matrix.target }}.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.target }}
          path: sbom-${{ matrix.target }}.cdx.json
          retention-days: 90

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: docker push "${{ steps.name.outputs.ref }}"

  deploy:
    name: Deploy (radar.muhammedasef.com)
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Environment: secret'lar sadece bu işte görünür; istenirse onay şartı eklenebilir.
    environment:
      name: production
      url: https://radar.muhammedasef.com
    permissions:
      contents: read
      packages: read   # sunucuya iletilen geçici token sadece imaj çekebilir
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: SSH ile zr-deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          # Sunucu anahtarı önceden biliniyor: ilk bağlantıda körü körüne güvenme (TOFU) yok.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT

          printf '%s %s\n' "$GITHUB_ACTOR" "$REGISTRY_TOKEN" \
            | ssh -i ~/.ssh/deploy_key \
                  -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
                  -o ConnectTimeout=15 -o ServerAliveInterval=15 \
                  "deploy@${DEPLOY_HOST}" "sha-${GITHUB_SHA}"
