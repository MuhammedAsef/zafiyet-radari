# Geçici: sadece Let's Encrypt sertifikası alınana kadar. Sertifika gelince
# radar.muhammedasef.com.conf ile değiştirilir (KURULUM.md, adım 4).
server {
    listen 80;
    listen [::]:80;
    server_name radar.muhammedasef.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
