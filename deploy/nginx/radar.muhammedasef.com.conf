# /etc/nginx/sites-available/radar.muhammedasef.com
#
# TLS burada sonlanır; uygulama 127.0.0.1:8080'de düz HTTP dinler.
# Güvenlik başlıklarını (CSP, HSTS, X-Frame-Options...) uygulama kendisi gönderir; burada tekrar eklenmez,
# aksi halde tarayıcı iki farklı CSP'yi birlikte uygular.

# Giriş/kayıt için IP başına ek sınır (uygulamadaki rate limit'in önünde ikinci katman).
limit_req_zone $binary_remote_addr zone=zr_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name radar.muhammedasef.com;

    # Let's Encrypt doğrulaması (ilk alım ve yenilemeler).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radar.muhammedasef.com;

    ssl_certificate     /etc/letsencrypt/live/radar.muhammedasef.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.muhammedasef.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    limit_req_status 429;

    # Envanter dosyası sınırı 10 MB (uygulama ayrıca kontrol eder).
    client_max_body_size 11m;

    access_log /var/log/nginx/radar.access.log;
    error_log  /var/log/nginx/radar.error.log warn;

    # Sağlık kontrolü sadece sunucunun kendisinden (zr-deploy doğrudan 127.0.0.1:8080'e gider).
    location = /health {
        return 404;
    }

    location = /Account/Login {
        limit_req zone=zr_auth burst=5 nodelay;
        include /etc/nginx/snippets/zr-proxy.conf;
    }

    location = /Account/Register {
        limit_req zone=zr_auth burst=5 nodelay;
        include /etc/nginx/snippets/zr-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/zr-proxy.conf;
    }
}
