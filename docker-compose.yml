# Lokal geliştirme ortamı. Production için: deploy/docker-compose.prod.yml
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zr-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Dev_Passw0rd!}"
    ports:
      - "127.0.0.1:1433:1433"   # sadece bu makine; yerel ağa açık değil
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Geliştirme mail kutusu: gönderilen mailler dışarı çıkmaz, http://localhost:8025 adresinde görünür.
  # Portlar sadece bu makineye açık (127.0.0.1).
  mailpit:
    image: axllent/mailpit:latest
    container_name: zr-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mssql-data:
